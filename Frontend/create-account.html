<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AcadVerify — Create Account</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#04070f;
  --bg2:#070c18;
  --gold:#e8b84b;
  --gold2:#f5d280;
  --gold3:#a07828;
  --teal:#00d4b4;
  --blue:#3a7bd5;
  --cream:#ede8de;
  --muted:#6b7694;
  --muted2:#9aa3bd;
  --border:rgba(232,184,75,0.2);
  --red:#f06060;
}

html,body{
  height:100%;
  background:var(--bg);
  font-family:'Outfit',sans-serif;
  color:var(--cream);
  overflow:hidden;
  cursor:none; /* Hides default cursor */
}

/* SIMPLE CURSOR */
#cursor{
  position:fixed;
  width:12px;
  height:12px;
  background:var(--gold);
  border-radius:50%;
  pointer-events:none;
  z-index:9999;
  transform:translate(-50%,-50%);
  mix-blend-mode:difference;
}

/* CANVAS */
#starCanvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:0;
  pointer-events:none;
}

/* GRAIN */
body::after{
  content:'';
  position:fixed;
  inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
  background-size:180px 180px;
  pointer-events:none;
  z-index:1;
  opacity:.7;
}

/* AURORA */
.aurora{
  position:fixed;
  border-radius:50%;
  filter:blur(120px);
  pointer-events:none;
  z-index:0;
  animation:aMove ease-in-out infinite alternate;
}

.a1{
  width:620px;
  height:520px;
  top:-160px;
  left:-120px;
  background:radial-gradient(ellipse,rgba(58,123,213,0.16) 0%,transparent 70%);
  animation-duration:14s;
}

.a2{
  width:520px;
  height:420px;
  bottom:-120px;
  right:-90px;
  background:radial-gradient(ellipse,rgba(0,212,180,0.11) 0%,transparent 70%);
  animation-duration:19s;
}

.a3{
  width:420px;
  height:360px;
  top:35%;
  left:28%;
  background:radial-gradient(ellipse,rgba(232,184,75,0.07) 0%,transparent 70%);
  animation-duration:23s;
}

@keyframes aMove{
  from{transform:translate(0,0) scale(1);}
  to{transform:translate(40px,28px) scale(1.08);}
}

/* LAYOUT */
.page{
  display:grid;
  grid-template-columns:1.1fr .9fr;
  height:100vh;
  position:relative;
  z-index:2;
}

/* LEFT */
.left{
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:3rem 2.8rem;
  overflow:hidden;
  border-right:1px solid rgba(232,184,75,0.07);
}

.left::before{
  content:'';
  position:absolute;
  inset:0;
  background-image:
    linear-gradient(rgba(232,184,75,0.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(232,184,75,0.05) 1px,transparent 1px);
  background-size:52px 52px;
  animation:gScroll 24s linear infinite;
  mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,black 30%,transparent 100%);
}

@keyframes gScroll{
  to{background-position:52px 52px;}
}

/* LOGO */
.logo-block{
  position:relative;
  z-index:2;
  text-align:center;
  margin-bottom:2.5rem;
  opacity:0;
  animation:fUp .8s .1s forwards;
}

@keyframes fUp{
  to{
    opacity:1;
    transform:none;
  }
  from{
    opacity:0;
    transform:translateY(22px);
  }
}

.seal-container{
  position:relative;
  width:126px;
  height:126px;
  margin:0 auto 1.4rem;
}

.seal-svg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

.seal-core{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:2.5rem;
}

.brand{
  font-family:'Cormorant Garamond',serif;
  font-size:2.55rem;
  font-weight:700;
  background:linear-gradient(135deg,var(--gold2),var(--gold),var(--gold3));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.brand-tag{
  font-size:.7rem;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--muted);
  margin-top:.3rem;
}

/* RIGHT */
.right{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:2rem 3rem 2rem 2.5rem;
}

/* CARD */
.card-wrap{
  position:relative;
  width:100%;
  max-width:430px;
  opacity:0;
  animation:fUp .9s .2s forwards;
}

.card-wrap::before{
  content:'';
  position:absolute;
  inset:-1px;
  border-radius:22px;
  background:conic-gradient(from var(--a,0deg),transparent,var(--gold),var(--teal),transparent);
  -webkit-mask:
      linear-gradient(#fff 0 0) content-box,
      linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;
  padding:1px;
  opacity:.55;
  animation:spinBorder 4s linear infinite;
}

@keyframes spinBorder{
  to{--a:360deg;}
}

@property --a{
  syntax:'<angle>';
  initial-value:0deg;
  inherits:false;
}

.card{
  background:rgba(6,10,22,0.88);
  backdrop-filter:blur(28px) saturate(1.5);
  border:1px solid rgba(232,184,75,0.11);
  border-radius:20px;
  padding:2.2rem 2.4rem;
  position:relative;
  overflow:hidden;
}

.card::before{
  content:'';
  position:absolute;
  top:0;
  left:15%;
  right:15%;
  height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),var(--teal),transparent);
  opacity:.45;
}

/* FORM HEAD */
.fhead{
  margin-bottom:1.6rem;
}

.fhead h1{
  font-family:'Cormorant Garamond',serif;
  font-size:2.2rem;
}

.fhead h1 em{
  font-style:italic;
  background:linear-gradient(90deg,var(--gold2),var(--teal));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.fhead p{
  margin-top:.45rem;
  font-size:.84rem;
  color:var(--muted2);
}

/* ROLE TABS */
.rtabs{
  display:flex;
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.06);
  border-radius:12px;
  padding:4px;
  margin-bottom:1.5rem;
}

.rtab{
  flex:1;
  padding:.42rem;
  text-align:center;
  font-size:.77rem;
  color:var(--muted);
  border-radius:9px;
  transition:.2s;
}

.rtab.active{
  color:var(--gold2);
  background:linear-gradient(135deg,rgba(232,184,75,0.14),rgba(0,212,180,0.07));
}

/* FIELD */
.field{
  margin-bottom:1rem;
  position:relative;
}

.fi{
  width:100%;
  padding:.88rem 1rem .52rem 2.75rem;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.07);
  border-radius:12px;
  color:var(--cream);
  font-size:.87rem;
  outline:none;
  transition:.25s;
}

.fi::placeholder{
  color:transparent;
}

.fi:focus{
  border-color:rgba(232,184,75,.38);
  background:rgba(232,184,75,0.045);
}

.fl{
  position:absolute;
  left:42px;
  top:50%;
  transform:translateY(-50%);
  color:var(--muted);
  font-size:.84rem;
  transition:.2s;
  pointer-events:none;
}

.fi:focus~.fl,
.fi:not(:placeholder-shown)~.fl{
  top:8px;
  transform:translateY(0) scale(.74);
  color:var(--gold);
}

.ficon{
  position:absolute;
  left:13px;
  top:50%;
  transform:translateY(-50%);
  color:var(--muted);
}

.eye{
  position:absolute;
  right:11px;
  top:50%;
  transform:translateY(-50%);
  background:none;
  border:none;
  color:var(--muted);
  cursor:none;
}

/* BUTTON */
.btncta{
  width:100%;
  padding:.88rem 1rem;
  border:none;
  border-radius:13px;
  font-size:.9rem;
  font-weight:600;
  letter-spacing:.05em;
  cursor:none;
  background:linear-gradient(135deg,#d4a43c,#ecc85e,#b8852a);
  color:#05080f;
  margin-top:.5rem;
  transition:.2s;
}

.btncta:hover{
  transform:translateY(-2px);
}

/* LINK */
.blink{
  text-align:center;
  margin-top:1.4rem;
  font-size:.8rem;
  color:var(--muted);
}

.blink a{
  text-decoration:none;
  background:linear-gradient(90deg,var(--gold2),var(--teal));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  font-weight:600;
}

/* ERROR */
.errbar{
  display:none;
  background:rgba(240,96,96,.1);
  border:1px solid rgba(240,96,96,.28);
  border-radius:10px;
  padding:.58rem .9rem;
  font-size:.77rem;
  color:#f09090;
  margin-bottom:.95rem;
}

/* TOAST */
.toast{
  position:fixed;
  bottom:2rem;
  right:2rem;
  background:rgba(6,10,22,.95);
  border:1px solid rgba(0,212,180,.28);
  border-radius:14px;
  padding:1rem 1.4rem;
  display:flex;
  gap:.8rem;
  transform:translateX(200%);
  transition:.45s;
  z-index:1000;
}

.toast.show{
  transform:translateX(0);
}

@media(max-width:820px){
  .page{grid-template-columns:1fr;}
  .left{display:none;}
  .right{padding:1.5rem;}
}
</style>
</head>

<body>

<!-- ONLY THE SIMPLE DOT CURSOR REMAINS -->
<div id="cursor"></div>

<canvas id="starCanvas"></canvas>

<div class="aurora a1"></div>
<div class="aurora a2"></div>
<div class="aurora a3"></div>

<div class="page">

  <!-- LEFT -->
  <div class="left">

    <div class="logo-block">

      <div class="seal-container">

        <svg class="seal-svg" viewBox="0 0 126 126" fill="none">

          <circle cx="63" cy="63" r="58"
            stroke="url(#gr)"
            stroke-width="1.5"
            stroke-dasharray="8 5">

            <animateTransform
              attributeName="transform"
              type="rotate"
              from="0 63 63"
              to="360 63 63"
              dur="26s"
              repeatCount="indefinite"/>

          </circle>

          <defs>
            <linearGradient id="gr">
              <stop offset="0%" stop-color="#e8b84b"/>
              <stop offset="50%" stop-color="#00d4b4"/>
              <stop offset="100%" stop-color="#e8b84b"/>
            </linearGradient>
          </defs>

        </svg>

        <div class="seal-core">🎓</div>

      </div>

      <div class="brand">AcadVerify</div>
      <div class="brand-tag">Academic Authenticity Platform</div>

    </div>

  </div>

  <!-- RIGHT -->
  <div class="right">

    <div class="card-wrap">

      <div class="card">

        <div class="fhead">
          <h1>Create <em>Account</em></h1>
          <p>Join the academic authenticity verification platform</p>
        </div>

        <div class="rtabs" id="rtabs">
          <div class="rtab active">Verifier</div>
          <div class="rtab">Institution</div>
          <div class="rtab">Admin</div>
        </div>

        <div class="errbar" id="errBar">
          Please fill all fields correctly.
        </div>

        <!-- NAME -->
        <div class="field">
          <span class="ficon">👤</span>
          <input class="fi" type="text" id="nameInp" placeholder="name"/>
          <label class="fl">Full Name</label>
        </div>

        <!-- EMAIL -->
        <div class="field">
          <span class="ficon">✉</span>
          <input class="fi" type="email" id="emailInp" placeholder="email"/>
          <label class="fl">Email Address</label>
        </div>

        <!-- PASSWORD -->
        <div class="field">
          <span class="ficon">🔒</span>
          <input class="fi" type="password" id="passInp" placeholder="password"/>
          <label class="fl">Create Password</label>

          <button class="eye" id="eyeBtn" type="button">👁</button>
        </div>

        <!-- CONFIRM -->
        <div class="field">
          <span class="ficon">🔐</span>
          <input class="fi" type="password" id="confirmInp" placeholder="confirm"/>
          <label class="fl">Confirm Password</label>
        </div>

        <button class="btncta" id="createBtn">
          Create New Account →
        </button>

        <!-- LOGIN LINK -->
        <div class="blink">
          Already have an account?
          <a href="login.html">Sign in</a>
        </div>

      </div>

    </div>

  </div>

</div>

<div class="toast" id="toast">
  ✅ Account Created Successfully
</div>

<script>

/* SIMPLE CURSOR LOGIC */
const cur = document.getElementById('cursor');

document.addEventListener('mousemove', e => {
  // Dot follows instantly, no delay, no physics
  cur.style.left = e.clientX + 'px';
  cur.style.top = e.clientY + 'px';
});


/* STARS */
const cv=document.getElementById('starCanvas');
const c=cv.getContext('2d');

let W,H,stars=[];

function resize(){
  W=cv.width=window.innerWidth;
  H=cv.height=window.innerHeight;
}

resize();

window.addEventListener('resize',resize);

for(let i=0;i<120;i++){
  stars.push({
    x:Math.random()*W,
    y:Math.random()*H,
    r:Math.random()*1.5
  });
}

function draw(){
  c.clearRect(0,0,W,H);

  stars.forEach(s=>{
    c.beginPath();
    c.arc(s.x,s.y,s.r,0,Math.PI*2);
    c.fillStyle='rgba(232,184,75,.7)';
    c.fill();
  });

  requestAnimationFrame(draw);
}

draw();

/* ROLE TAB */
document.querySelectorAll('.rtab').forEach(tab=>{
  tab.addEventListener('click',()=>{
    document.querySelectorAll('.rtab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
  });
});

/* PASSWORD EYE */
const passInp=document.getElementById('passInp');

document.getElementById('eyeBtn').addEventListener('click',()=>{
  passInp.type=passInp.type==='password'?'text':'password';
});

/* CREATE ACCOUNT */
const createBtn=document.getElementById('createBtn');
const errBar=document.getElementById('errBar');
const toast=document.getElementById('toast');

createBtn.addEventListener('click',()=>{

  const name=document.getElementById('nameInp').value.trim();
  const email=document.getElementById('emailInp').value.trim();
  const pass=document.getElementById('passInp').value;
  const confirm=document.getElementById('confirmInp').value;

  errBar.style.display='none';

  if(!name || !email || !pass || !confirm){
    errBar.innerText='Please fill all fields.';
    errBar.style.display='block';
    return;
  }

  if(!/\S+@\S+\.\S+/.test(email)){
    errBar.innerText='Enter valid email.';
    errBar.style.display='block';
    return;
  }

  if(pass.length < 6){
    errBar.innerText='Password should be at least 6 characters.';
    errBar.style.display='block';
    return;
  }

  if(pass !== confirm){
    errBar.innerText='Passwords do not match.';
    errBar.style.display='block';
    return;
  }

  toast.classList.add('show');

  setTimeout(()=>{
    window.location.href='login.html';
  },2000);

});


</script>

</body>
</html>
